name: publish

# Publishing a GitHub release uploads that version to PyPI through trusted
# publishing; no token is stored in the repository.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/tests.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

  pypi:
    needs: [check, version]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codex-transcript-viewer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
